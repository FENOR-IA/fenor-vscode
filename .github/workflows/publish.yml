name: Publicar

# Cria uma tag de versão (ex.: git tag v0.1.0 && git push --tags) para publicar.
# Secrets: VSCE_PAT (Marketplace do VS Code) e OVSX_PAT (Open VSX). Sem o secret, o destino é pulado.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # No nível do job: o "if" de um passo não enxerga o env declarado no próprio passo.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Confere se a tag bate com a versão do package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME diferente da versão $VERSION"; exit 1; }

      - run: npx vsce package -o fenor.vsix

      - name: Pacote do terminal / MCP (IntelliJ)
        run: npm run build:cli && (cd dist && zip -qr ../fenor-cli.zip .)

      - name: Marketplace do VS Code
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath fenor.vsix -p "$VSCE_PAT"

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish fenor.vsix -p "$OVSX_PAT"

      - name: Release no GitHub com o .vsix e o fenor-cli.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fenor.vsix fenor-cli.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
